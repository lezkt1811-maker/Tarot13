<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarot 13 Shuffler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: a single night-sky table. Deck in the middle, five shuffle controls beneath, spread laid out below. */
:root{
  --sky:#070B14; --sky-2:#0E1428; --line:#24304F;
  --text:#F4F6FF; --muted:#AEB8D6;
  --gold:#E8B84A; --gold-hi:#FFE08A;
  --cyan:#22D3EE; --blue:#2563FF; --violet:#A855F7; --magenta:#FF2ED1;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'Jost', 'Futura', 'Century Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html,body{background:var(--sky);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 64px;
  background:radial-gradient(90% 50% at 50% 0%, #131c3f 0%, var(--sky) 70%) fixed, var(--sky)}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,44px);letter-spacing:.2em;margin:0;color:var(--gold-hi);
  text-shadow:0 0 18px rgba(232,184,74,.45);text-wrap:balance}
.sub{color:var(--muted);letter-spacing:.32em;text-transform:uppercase;font-size:12px}

.table{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;justify-items:center}
.deck-zone{position:relative;width:100%;max-width:640px;height:300px;display:flex;align-items:center;justify-content:center}
.deck{position:relative;width:150px;height:225px}
.back{position:absolute;inset:0;border-radius:10px;background:#000 center/cover no-repeat;background-image:var(--back-img);
  box-shadow:0 0 0 1px rgba(232,184,74,.55),0 10px 24px rgba(0,0,0,.6)}
.deck .back:nth-child(1){transform:translate(-3px,3px)}
.deck .back:nth-child(2){transform:translate(-1.5px,1.5px)}
.deck .back:nth-child(3){box-shadow:0 0 0 1px rgba(232,184,74,.7),0 0 26px rgba(232,184,74,.25),0 14px 30px rgba(0,0,0,.7)}
.ghost{position:absolute;left:50%;top:50%;width:150px;height:225px;margin:-112.5px 0 0 -75px;pointer-events:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;letter-spacing:.08em}
.count b{color:var(--text);font-weight:600}

.methods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%}
.m{appearance:none;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky-2),var(--sky));color:var(--text);
  border-radius:12px;padding:14px 10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  font:inherit;min-height:44px;transition:border-color .2s, box-shadow .2s, transform .15s}
.m svg{width:30px;height:30px;stroke:var(--mc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--mc))}
.m .n{font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.m .d{font-size:12px;color:var(--muted);line-height:1.35}
.m:hover:not(:disabled){border-color:var(--mc);box-shadow:0 0 18px -4px var(--mc);transform:translateY(-1px)}
.m:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.m:disabled{opacity:.45;cursor:default}

.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer}
.toggle input{accent-color:var(--gold);width:18px;height:18px}
.btn{appearance:none;font:inherit;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;min-height:44px;padding:0 20px;border-radius:999px;cursor:pointer;
  border:1px solid var(--gold);color:var(--sky);background:linear-gradient(180deg,var(--gold-hi),var(--gold))}
.btn.ghosty{background:transparent;color:var(--gold-hi)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
select{font:inherit;font-size:14px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--sky-2);color:var(--text)}
label.sel{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}

.log{width:100%;max-width:640px;font-size:13px;color:var(--muted);text-align:center;min-height:1.5em}
.log b{color:var(--gold-hi);font-weight:500}

.spread{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;width:100%}
.slot{display:flex;flex-direction:column;align-items:center;gap:10px;width:170px}
.pos{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.face{position:relative;width:170px;height:255px;border-radius:12px;background:radial-gradient(110% 70% at 70% 15%,#121c3e 0%,var(--sky) 65%);
  box-shadow:0 0 0 1.5px var(--sc),0 0 18px -2px var(--sc),inset 0 0 22px -8px var(--sc);display:flex;flex-direction:column;align-items:center;
  padding:16px 12px 14px;gap:8px;transition:transform .6s}
.face::before{content:"";position:absolute;inset:7px;border:1px solid rgba(232,184,74,.75);border-radius:7px;pointer-events:none}
.face.rev{transform:rotate(180deg)}
.face .num{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold-hi)}
.face .sym{flex:1;display:grid;place-items:center;width:100%}
.face .sym svg{width:84px;height:84px}
.face .nm{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;text-align:center;color:var(--gold-hi);line-height:1.2;text-wrap:balance;text-transform:uppercase}
.face .co{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--sc);text-align:center;line-height:1.3}
.meaning{font-size:13px;color:var(--muted);text-align:center;line-height:1.4}
.meaning b{color:var(--text);font-weight:500}
.empty{color:var(--muted);font-size:14px;text-align:center;max-width:44ch}
.flip-in{animation:flip .55s ease-out both}
@keyframes flip{from{opacity:0;transform:translateY(-30px) rotateY(80deg)}to{opacity:1;transform:none}}
.face.rev.flip-in{animation:flipR .55s ease-out both}
@keyframes flipR{from{opacity:0;transform:translateY(-30px) rotate(180deg) rotateY(80deg)}to{opacity:1;transform:rotate(180deg)}}

@media (max-width:720px){
  .methods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .methods .m:last-child{grid-column:1 / -1}
  .deck-zone{height:260px}
  .slot{width:140px}.face{width:140px;height:210px}.face .sym svg{width:64px;height:64px}
}
@media (prefers-reduced-motion:reduce){.flip-in,.face.rev.flip-in{animation:none}.m,.face{transition:none}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>TAROT 13</h1>
    <div class="sub">Shuffle the sky</div>
  </header>

  <section class="table" aria-label="Deck">
    <div class="deck-zone" id="zone">
      <div class="deck" id="deck" aria-hidden="true"><div class="back"></div><div class="back"></div><div class="back"></div></div>
    </div>
    <div class="count" id="count" aria-live="polite"><b>78</b> cards · fresh deck</div>

    <div class="methods" role="group" aria-label="Shuffle methods">
      <button class="m" id="m-riffle" data-m="riffle" style="--mc:var(--cyan)">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 22 C10 12, 14 12, 16 16 C18 12, 22 12, 26 22"/><path d="M5 26h9M18 26h9"/></svg>
        <span class="n">Riffle</span><span class="d">Split in half, interleave the edges</span>
      </button>
      <button class="m" id="m-overhand" data-m="overhand" style="--mc:var(--blue)">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="5" width="14" height="6" rx="1.5"/><rect x="9" y="21" width="14" height="6" rx="1.5"/><path d="M16 12v7M13 16l3 3 3-3"/></svg>
        <span class="n">Overhand</span><span class="d">Drop small packets hand to hand</span>
      </button>
      <button class="m" id="m-wash" data-m="wash" style="--mc:var(--magenta)">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5a11 11 0 1 1-10.4 7.4"/><path d="M5 7v6h6"/><circle cx="16" cy="16" r="2.4"/></svg>
        <span class="n">Wash</span><span class="d">Swirl face-down on the table; reverses cards</span>
      </button>
      <button class="m" id="m-cut" data-m="cut" style="--mc:var(--gold)">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="10" width="7" height="12" rx="1.2"/><rect x="12.5" y="10" width="7" height="12" rx="1.2"/><rect x="22" y="10" width="7" height="12" rx="1.2"/></svg>
        <span class="n">Three-Pile Cut</span><span class="d">Cut into three, restack; may turn one pile</span>
      </button>
      <button class="m" id="m-pile" data-m="pile" style="--mc:var(--violet)">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="2.5"/><g><rect x="14" y="2" width="4" height="6" rx=".8"/><rect x="24" y="9" width="4" height="6" rx=".8"/><rect x="21" y="22" width="4" height="6" rx=".8"/><rect x="7" y="22" width="4" height="6" rx=".8"/><rect x="4" y="9" width="4" height="6" rx=".8"/></g></svg>
        <span class="n">13-Pile Deal</span><span class="d">Deal into 13 piles, gather in random order</span>
      </button>
    </div>

    <div class="log" id="log" aria-live="polite">Pick a shuffle, or combine several, then draw.</div>

    <div class="controls">
      <label class="toggle" for="rev"><input type="checkbox" id="rev" checked> Allow reversals</label>
      <label class="sel" for="spreadSel">Spread
        <select id="spreadSel">
          <option value="1">One card</option>
          <option value="3" selected>Past · Present · Future</option>
          <option value="5">Five-star cross</option>
          <option value="13">Thirteen-card wheel</option>
        </select>
      </label>
      <button class="btn" id="draw">Draw</button>
      <button class="btn ghosty" id="reset">New deck</button>
    </div>
  </section>

  <section aria-label="Your spread">
    <div class="spread" id="spread"><p class="empty">Your cards will appear here, laid out in the spread you choose.</p></div>
  </section>
</div>

const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fresh(){ deck = CARDS.map((c,i)=>({i,rev:false})); shuffles=[]; }
fresh();

/* ---- five shuffle methods (all operate on the real deck order) ---- */
function riffle(d){
  // Gilbert–Shannon–Reeds riffle: binomial cut, then drop cards proportionally to pile size
  let k=0; for(let i=0;i<d.length;i++) if(Math.random()<.5) k++;
  let a=d.slice(0,k), b=d.slice(k), out=[];
  while(a.length||b.length){ (Math.random()*(a.length+b.length) < a.length ? out.push(a.shift()) : out.push(b.shift())); }
  return out;
}
function overhand(d){
  let src=d.slice(), out=[];
  while(src.length){ const n=Math.min(src.length,1+rnd(8)); out=src.splice(0,n).concat(out); }
  return out;
}
function wash(d, allowRev){
  const out=d.map(c=>({...c, rev: allowRev && Math.random()<.5 ? !c.rev : c.rev}));
  for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]];}
  return out;
}
function cut(d, allowRev){
  const a=8+rnd(Math.floor(d.length/3)), b=a+8+rnd(Math.floor(d.length/3));
  let piles=[d.slice(0,a), d.slice(a,b), d.slice(b)];
  let turned=-1;
  if(allowRev && Math.random()<.5){ turned=rnd(3); piles[turned]=piles[turned].slice().reverse().map(c=>({...c,rev:!c.rev})); }
  const order=[0,1,2].sort(()=>Math.random()-.5);
  return {deck:order.flatMap(p=>piles[p]), turned, order};
}
function pileDeal(d, n=13){
  const piles=Array.from({length:n},()=>[]);
  d.forEach((c,i)=>piles[i%n].unshift(c));
  const order=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=rnd(i+1);[order[i],order[j]]=[order[j],order[i]];}
  return order.flatMap(p=>piles[p]);
}

/* ---- animations ---- */
const zone=$('zone');
function ghosts(n){ return Array.from({length:n},()=>{const g=document.createElement('div');g.className='back ghost';zone.appendChild(g);return g;}); }
function anim(el, frames, ms, delay=0){ return el.animate(frames,{duration:ms,delay,easing:'cubic-bezier(.4,.1,.2,1)',fill:'forwards'}).finished; }
async function play(method){
  if(reduced) return;
  const W=Math.min(zone.clientWidth,640), s=W/640;
  $('deck').style.visibility='hidden';
  let gs, jobs=[];
  if(method==='riffle'){
    gs=ghosts(14);
    gs.forEach((g,i)=>{const L=i%2===0, x=(L?-95:95)*s, y=-(i>>1)*2;
      jobs.push(anim(g,[{transform:'none'},{transform:`translate(${x}px,${y}px) rotate(${L?-8:8}deg)`,offset:.45},{transform:`translate(${x*.4}px,${y}px) rotate(${L?-4:4}deg)`,offset:.65},{transform:`translate(0,${-i*1.2}px)`}],900,i*25));});
  } else if(method==='overhand'){
    gs=ghosts(8);
    gs.forEach((g,i)=>{jobs.push(anim(g,[{transform:'none'},{transform:`translate(${70*s}px,-60px) rotate(6deg)`,offset:.5},{transform:`translate(0,${-i}px)`}],520,i*110));});
  } else if(method==='wash'){
    gs=ghosts(12);
    gs.forEach((g,i)=>{const a=(i/12)*Math.PI*2, r=(150+rnd(60))*s;
      jobs.push(anim(g,[{transform:'none'},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r*.35}px) rotate(${rnd(180)-90}deg)`,offset:.4},{transform:`translate(${Math.cos(a+2)*r*.6}px,${Math.sin(a+2)*r*.25}px) rotate(${rnd(360)}deg)`,offset:.7},{transform:'none'}],1300,i*20));});
  } else if(method==='cut'){
    gs=ghosts(3);
    gs.forEach((g,i)=>{const x=(i-1)*175*s;
      jobs.push(anim(g,[{transform:'none'},{transform:`translate(${x}px,0)`,offset:.4},{transform:`translate(${x}px,0)`,offset:.6},{transform:`translate(0,${-i*2}px)`}],1000,i*60));});
  } else if(method==='pile'){
    gs=ghosts(13);
    gs.forEach((g,i)=>{const a=-Math.PI/2+(i/13)*Math.PI*2, rx=230*s, ry=95;
      jobs.push(anim(g,[{transform:'none'},{transform:`translate(${Math.cos(a)*rx}px,${Math.sin(a)*ry}px) scale(.55)`,offset:.5},{transform:`translate(${Math.cos(a)*rx}px,${Math.sin(a)*ry}px) scale(.55)`,offset:.65},{transform:'none'}],1250,i*45));});
  }
  await Promise.all(jobs);
  gs.forEach(g=>g.remove());
  $('deck').style.visibility='';
}

/* ---- UI ---- */
const NAMES={riffle:'Riffle',overhand:'Overhand',wash:'Wash',cut:'Three-pile cut',pile:'13-pile deal'};
function lock(b){ document.querySelectorAll('.m,#draw,#reset').forEach(x=>x.disabled=b); }
function status(){
  const revs=deck.filter(c=>c.rev).length;
  $('count').innerHTML=`<b>78</b> cards · ${shuffles.length? `${shuffles.length} shuffle${shuffles.length>1?'s':''}`:'fresh deck'}${revs?` · ${revs} reversed`:''}`;
}
async function doShuffle(m){
  lock(true);
  const allowRev=$('rev').checked; let note='';
  if(m==='riffle') deck=riffle(deck);
  else if(m==='overhand') deck=overhand(deck);
  else if(m==='wash') deck=wash(deck,allowRev);
  else if(m==='cut'){ const r=cut(deck,allowRev); deck=r.deck; note=r.turned>=0?` (pile ${r.turned+1} turned)`:''; }
  else if(m==='pile') deck=pileDeal(deck);
  shuffles.push(m);
  await play(m);
  const recent=shuffles.slice(-6).map(x=>NAMES[x]).join(' → ');
  $('log').innerHTML=`<b>${NAMES[m]}</b>${note}. ${shuffles.length>6?'… ':''}${recent}`;
  status(); lock(false);
}
document.querySelectorAll('.m').forEach(b=>b.addEventListener('click',()=>doShuffle(b.dataset.m)));

function faceHTML(c, rev){
  const d=CARDS[c.i], sc=SUIT_COLOR[d.arcana];
  const num = d.arcana==='Major' ? d.number : (/^\d+$/.test(d.number) ? (d.number==='1'?'A':d.number) : d.number[0]);
  return `<div class="face${rev?' rev':''} flip-in" style="--sc:${sc}">
    <div class="num">${num}</div>
    <div class="sym"><svg viewBox="0 0 100 100" aria-hidden="true">${ICON[d.arcana]}</svg></div>
    <div class="nm">${d.card}</div>
    <div class="co">${d.correspondence.replace(/\s*\(.*$/,'').replace(/\?.*$/,'')}</div>
  </div>`;
}
$('draw').addEventListener('click',()=>{
  const n=+$('spreadSel').value, pos=SPREADS[n], allowRev=$('rev').checked;
  const hand=deck.slice(0,n);
  $('spread').innerHTML=hand.map((c,k)=>{
    const d=CARDS[c.i], rev=allowRev && c.rev;
    return `<div class="slot"><div class="pos">${pos[k]}</div>${faceHTML(c,rev)}
      <div class="meaning"><b>${d.card}${rev?' · reversed':''}</b><br>${d.keywords}</div></div>`;
  }).join('');
  [...document.querySelectorAll('.face')].forEach((f,k)=>f.style.animationDelay=`${k*120}ms`);
  $('log').innerHTML=`Drew <b>${n}</b> from the top. Shuffle again or start a new deck.`;
});
$('reset').addEventListener('click',()=>{ fresh(); status(); $('log').textContent='New deck in natural order. Pick a shuffle.'; $('spread').innerHTML='<p class="empty">Your cards will appear here, laid out in the spread you choose.</p>'; });
$('rev').addEventListener('change',status);
</script>

</body></html>
